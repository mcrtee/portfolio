<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcrtee studio — game & web development</title>
<meta name="description" content="Game and web development studio: browser games, bots, web apps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15122e;--ink2:#1e1a42;--line:#352f6b;--text:#ece9ff;--mute:#a9a3d6;--violet:#7c5cff;--gold:#ffc94a;--sea:#2dd4bf;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font:400 17px/1.6 Manrope,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.logo{font-family:Unbounded,sans-serif;line-height:1.1}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:100px 0}
h2{font-size:clamp(28px,4vw,44px);font-weight:800;margin-bottom:14px}
.lead{color:var(--mute);max-width:620px;margin-bottom:44px}

/* nav */
header{position:fixed;inset:0 0 auto;z-index:50;background:rgba(21,18,46,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
.logo i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,var(--gold) 55%,#d99a1a);box-shadow:0 0 14px rgba(255,201,74,.6)}
nav ul{display:flex;gap:26px;list-style:none;font-weight:500;font-size:15px;color:var(--mute)}
nav a:hover{color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mute);padding:6px 14px;font:700 13px Manrope;cursor:pointer}
.lang button.on{background:var(--violet);color:#fff}
@media(max-width:760px){nav ul{display:none}}

/* hero */
.hero{min-height:100vh;display:flex;align-items:center;position:relative;padding:120px 0 70px;background:radial-gradient(900px 500px at 80% 10%,rgba(124,92,255,.35),transparent 60%),radial-gradient(700px 400px at 0 100%,rgba(45,212,191,.16),transparent 60%)}
#sky{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;pointer-events:none}
.hero .wrap *{pointer-events:auto}
.hero h1{font-size:clamp(38px,7vw,84px);font-weight:800;max-width:900px;margin-bottom:22px}
.hero p{max-width:540px;color:var(--mute);font-size:19px;margin-bottom:34px}
.btn{display:inline-block;border:0;cursor:pointer;font:700 16px Manrope;padding:15px 28px;border-radius:12px;background:var(--gold);color:#2a1d00;box-shadow:0 5px 0 #b8861a;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 #b8861a}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 #b8861a}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--line);margin-left:10px}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--violet)}
.score{position:absolute;right:24px;bottom:28px;z-index:2;background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;color:var(--mute)}
.score b{font:800 20px Unbounded;color:var(--gold);margin-left:6px}

/* about */
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.stat b{display:block;font:800 38px Unbounded;color:var(--gold)}
.stat span{color:var(--mute);font-size:15px}
.about p{color:var(--mute);margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chips span{border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:14px;font-weight:500}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* projects */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s;transform-style:preserve-3d}
.card:hover{border-color:var(--violet)}
.cover{height:190px;display:grid;place-items:center;font:800 54px Unbounded;color:rgba(255,255,255,.92);position:relative;overflow:hidden}
.cover small{position:absolute;left:16px;bottom:12px;font:700 12px Manrope;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:99px;color:#fff}
.c1{background:linear-gradient(135deg,#0e4f7a,#2dd4bf)}
.c2{background:linear-gradient(135deg,#5b3df0,#c26bff)}
.c3{background:linear-gradient(135deg,#e08a00,#ffc94a);color:#4a2f00}
.body{padding:24px;display:flex;flex-direction:column;gap:12px;flex:1}
.body h3{font-size:21px}
.body p{color:var(--mute);font-size:15.5px;flex:1}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-weight:700;font-size:14px}
.links a:first-child{background:var(--violet);border-color:var(--violet)}
.links a:hover{border-color:var(--gold)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;gap:14px}
.gal button{border:0;padding:0;border-radius:14px;overflow:hidden;cursor:zoom-in;position:relative;background:var(--ink2)}
.gal button:nth-child(1){grid-column:span 2;grid-row:span 2}
.gal button:nth-child(4){grid-column:span 2}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gal button:hover img{transform:scale(1.07)}
@media(max-width:760px){.gal{grid-template-columns:1fr 1fr}.gal button:nth-child(4){grid-column:span 1}}
.lb{position:fixed;inset:0;background:rgba(10,8,28,.92);display:none;place-items:center;z-index:100;padding:24px}
.lb.open{display:grid}
.lb img{max-width:100%;max-height:86vh;border-radius:14px}
.lb button{position:absolute;top:18px;right:22px;background:none;border:0;color:#fff;font-size:38px;cursor:pointer}

/* contact */
.contact{background:var(--ink2);border-block:1px solid var(--line)}
form{display:grid;gap:16px;max-width:460px}
label{font-weight:700;font-size:14px;display:grid;gap:6px}
input{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text);font:500 16px Manrope}
input:focus{outline:0;border-color:var(--gold)}
.msg{min-height:24px;font-weight:700}
.msg.ok{color:var(--sea)}.msg.err{color:#ff7a8a}
.hp{position:absolute;left:-9999px}
footer{padding:34px 0;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header><div class="wrap nav">
  <a href="#top" class="logo"><i></i><span>mcrtee studio</span></a>
  <nav><ul>
    <li><a href="#about" data-i="n_about"></a></li>
    <li><a href="#projects" data-i="n_proj"></a></li>
    <li><a href="#gallery" data-i="n_gal"></a></li>
    <li><a href="#contact" data-i="n_contact"></a></li>
  </ul></nav>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="ru" class="on">RU</button><button data-l="en">EN</button>
  </div>
</div></header>

<main id="top">
<section class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="wrap">
    <h1 data-i="h1"></h1>
    <p data-i="h_sub"></p>
    <a class="btn" href="#projects" data-i="h_cta1"></a><a class="btn ghost" href="#contact" data-i="h_cta2"></a>
  </div>
  <div class="score"><span data-i="coins"></span><b id="score">0</b></div>
</section>

<section id="about"><div class="wrap grid2 about">
  <div>
    <h2 data-i="a_title"></h2>
    <p data-i="a_p1"></p><p data-i="a_p2"></p>
    <div class="chips"><span>JavaScript</span><span>React</span><span>Node.js</span><span>WebSocket</span><span>Canvas</span><span>Telegram Bots</span></div>
  </div>
  <div class="stats">
    <div class="stat"><b data-count="3">0</b><span data-i="s1"></span></div>
    <div class="stat"><b data-count="2">0</b><span data-i="s2"></span></div>
    <div class="stat"><b data-count="100" data-suf="%">0</b><span data-i="s3"></span></div>
    <div class="stat"><b data-count="24" data-suf="/7">0</b><span data-i="s4"></span></div>
  </div>
</div></section>

<section id="projects"><div class="wrap">
  <h2 data-i="p_title"></h2><p class="lead" data-i="p_lead"></p>
  <div class="cards">
    <article class="card"><div class="cover c1">⚓<small data-i="t_game"></small></div><div class="body">
      <h3>Battleship</h3><p data-i="p1"></p>
      <div class="links"><a href="https://battleship-puce-psi.vercel.app/" target="_blank" rel="noopener" data-i="play"></a></div></div></article>
    <article class="card"><div class="cover c2">💬<small data-i="t_bot"></small></div><div class="body">
      <h3>Chat Bot</h3><p data-i="p2"></p>
      <div class="links"><a href="https://github.com/mcrtee/chat-bot" target="_blank" rel="noopener">GitHub</a></div></div></article>
    <article class="card"><div class="cover c3">🪙<small data-i="t_game"></small></div><div class="body">
      <h3>Coin Rush</h3><p data-i="p3"></p>
      <div class="links"><a href="https://coinrush-1uk0.onrender.com/?room=GCTD" target="_blank" rel="noopener" data-i="play"></a></div></div></article>
  </div>
</div></section>

<section id="gallery"><div class="wrap">
  <h2 data-i="g_title"></h2><p class="lead" data-i="g_lead"></p>
  <!-- Замените ссылки в массиве photos (JS ниже) на свои фото / Replace links in the photos array below with your own -->
  <div class="gal" id="gal"></div>
</div></section>

<section id="contact" class="contact"><div class="wrap grid2">
  <div><h2 data-i="c_title"></h2><p class="lead" data-i="c_lead"></p></div>
  <form id="form" novalidate>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label><span data-i="f_name"></span><input name="name" required maxlength="80" autocomplete="name"></label>
    <label><span data-i="f_phone"></span><input name="phone" type="tel" required maxlength="25" autocomplete="tel" placeholder="+996 ..."></label>
    <button class="btn" type="submit" data-i="f_send"></button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</div></section>
</main>

<footer><div class="wrap"><span>© <span id="yr"></span> mcrtee studio</span><a href="https://github.com/mcrtee" target="_blank" rel="noopener">GitHub</a></div></footer>

<div class="lb" id="lb"><button aria-label="Close">×</button><img alt=""></div>

<script>
/* ===== НАСТРОЙКИ / CONFIG ===== */
const CONFIG = {
  // Ключ с https://web3forms.com (введите свою почту — ключ придёт на неё). Ключ публичный, это нормально.
  ACCESS_KEY: "63ee9204-7ac5-48ee-bafa-cccce065ae18"
};

/* ===== ПЕРЕВОДЫ / I18N ===== */
const T = {
ru:{n_about:"О нас",n_proj:"Проекты",n_gal:"Галерея",n_contact:"Контакты",
h1:"Делаем игры и веб-продукты, в которые хочется вернуться",
h_sub:"Небольшая студия разработки: браузерные игры, чат-боты и веб-приложения под ключ. Поймайте монетку на экране — это уже первый уровень.",
h_cta1:"Смотреть проекты",h_cta2:"Нужна консультация",coins:"Монет:",
a_title:"О компании",a_p1:"Мы — студия разработки, которая создаёт браузерные игры, интерактивные сайты и ботов. Берём идею и доводим её до рабочего продукта, в который можно играть и которым можно пользоваться уже сегодня.",
a_p2:"Работаем с мультиплеером, реальным временем и аккуратным интерфейсом: от прототипа до запуска на хостинге.",
s1:"проекта в портфолио",s2:"языка интерфейса",s3:"работает в браузере",s4:"на связи",
p_title:"Проекты",p_lead:"Три продукта, которые можно открыть и попробовать прямо сейчас.",
t_game:"Игра",t_bot:"Бот",play:"Играть",
p1:"Классический морской бой в браузере: расставляйте корабли, стреляйте по полю соперника и побеждайте.",
p2:"Чат-бот с открытым исходным кодом. Исходники и инструкция по запуску — в репозитории на GitHub.",
p3:"Многопользовательская игра про сбор монет. Создайте комнату, пригласите друзей и соревнуйтесь в реальном времени.",
g_title:"Галерея",g_lead:"Кадры из наших проектов и рабочего процесса. Нажмите на фото, чтобы открыть его.",
c_title:"Обсудим ваш проект?",c_lead:"Оставьте имя и номер телефона — мы свяжемся с вами и проведём бесплатную консультацию.",
f_name:"Ваше имя",f_phone:"Номер телефона",f_send:"Заказать консультацию",
e_name:"Введите имя.",e_phone:"Введите корректный номер телефона.",sending:"Отправляем…",ok:"Готово! Мы свяжемся с вами в ближайшее время.",err:"Не удалось отправить. Попробуйте ещё раз чуть позже."},
en:{n_about:"About",n_proj:"Projects",n_gal:"Gallery",n_contact:"Contact",
h1:"We build games and web products people come back to",
h_sub:"A small development studio: browser games, chat bots and turnkey web apps. Catch a coin on screen — that's already level one.",
h_cta1:"View projects",h_cta2:"Book a consultation",coins:"Coins:",
a_title:"About the company",a_p1:"We are a development studio building browser games, interactive websites and bots. We take an idea and ship it as a working product you can play or use today.",
a_p2:"We work with multiplayer, real-time features and clean interfaces — from prototype to launch on hosting.",
s1:"projects in portfolio",s2:"interface languages",s3:"runs in the browser",s4:"available",
p_title:"Projects",p_lead:"Three products you can open and try right now.",
t_game:"Game",t_bot:"Bot",play:"Play",
p1:"Classic Battleship in the browser: place your ships, fire at the enemy grid and win.",
p2:"An open-source chat bot. Source code and setup instructions are in the GitHub repository.",
p3:"A multiplayer coin-collecting game. Create a room, invite friends and compete in real time.",
g_title:"Gallery",g_lead:"Shots from our projects and workflow. Click a photo to open it.",
c_title:"Let's talk about your project",c_lead:"Leave your name and phone number — we'll contact you for a free consultation.",
f_name:"Your name",f_phone:"Phone number",f_send:"Book a consultation",
e_name:"Enter your name.",e_phone:"Enter a valid phone number.",sending:"Sending…",ok:"Done! We'll contact you shortly.",err:"Could not send. Please try again a bit later."}
};
let lang = "ru";
try{ lang = localStorage.getItem("lang") || ((navigator.language||"").startsWith("ru") ? "ru" : "en"); }catch(e){}
function setLang(l){
  lang = l; try{localStorage.setItem("lang",l)}catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = T[l][el.dataset.i]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l===l));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.l));
setLang(lang);
document.getElementById("yr").textContent = new Date().getFullYear();

/* ===== ГАЛЕРЕЯ / GALLERY (временные фото — замените на свои) ===== */
const photos = [
  "https://picsum.photos/id/180/1200/900","https://picsum.photos/id/119/800/600",
  "https://picsum.photos/id/0/800/600","https://picsum.photos/id/60/1200/600",
  "https://picsum.photos/id/20/800/600","https://picsum.photos/id/160/800/600"
];
const gal = document.getElementById("gal"), lb = document.getElementById("lb"), lbImg = lb.querySelector("img");
photos.forEach((src,i) => {
  const b = document.createElement("button");
  b.innerHTML = `<img src="${src}" alt="Gallery ${i+1}" loading="lazy">`;
  b.onclick = () => { lbImg.src = src; lb.classList.add("open"); };
  gal.appendChild(b);
});
lb.onclick = () => lb.classList.remove("open");
addEventListener("keydown", e => e.key==="Escape" && lb.classList.remove("open"));

/* ===== МОНЕТЫ В HERO / CLICKABLE COINS ===== */
const cv = document.getElementById("sky"), cx = cv.getContext("2d");
let W, H, coins = [], score = 0;
const scoreEl = document.getElementById("score");
function size(){ const r = cv.parentElement.getBoundingClientRect(); W = cv.width = r.width; H = cv.height = r.height; }
addEventListener("resize", size); size();
function spawn(){ coins.push({x:Math.random()*W, y:-30, r:14+Math.random()*12, v:.8+Math.random()*1.6, p:Math.random()*6}); }
for(let i=0;i<8;i++){ spawn(); coins[i].y = Math.random()*H; }
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
function draw(){
  cx.clearRect(0,0,W,H);
  coins.forEach(c => {
    if(!reduce) c.y += c.v; c.p += .05;
    const sx = Math.abs(Math.cos(c.p)) * c.r * .8 + c.r * .2;
    cx.beginPath(); cx.ellipse(c.x, c.y, sx, c.r, 0, 0, 7);
    const g = cx.createRadialGradient(c.x-sx*.3,c.y-c.r*.3,2,c.x,c.y,c.r);
    g.addColorStop(0,"#fff3b8"); g.addColorStop(.6,"#ffc94a"); g.addColorStop(1,"#d99a1a");
    cx.fillStyle = g; cx.fill(); cx.strokeStyle = "#a8720f"; cx.lineWidth = 2; cx.stroke();
  });
  coins = coins.filter(c => c.y < H + 40);
  while(coins.length < 9) spawn();
  requestAnimationFrame(draw);
}
draw();
document.querySelector(".hero").addEventListener("click", e => {
  if(e.target.closest("a,button")) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const i = coins.findIndex(c => Math.hypot(c.x-x, c.y-y) < c.r + 8);
  if(i > -1){ coins.splice(i,1); scoreEl.textContent = ++score; }
});

/* ===== СЧЁТЧИКИ / COUNTERS ===== */
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return; io.unobserve(e.target);
  const el = e.target, to = +el.dataset.count, suf = el.dataset.suf || ""; let n = 0;
  const t = setInterval(() => { n += Math.max(1, Math.round(to/30)); if(n >= to){ n = to; clearInterval(t); } el.textContent = n + suf; }, 35);
}), {threshold:.6});
document.querySelectorAll("[data-count]").forEach(el => io.observe(el));

/* ===== 3D-НАКЛОН КАРТОЧЕК / CARD TILT ===== */
if(!reduce && matchMedia("(hover:hover)").matches){
  document.querySelectorAll(".card").forEach(c => {
    c.addEventListener("mousemove", e => {
      const r = c.getBoundingClientRect(), x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
      c.style.transform = `perspective(800px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-4px)`;
    });
    c.addEventListener("mouseleave", () => c.style.transform = "");
  });
}

/* ===== ФОРМА → TELEGRAM / FORM → TELEGRAM ===== */
const form = document.getElementById("form"), msg = document.getElementById("msg");
let lastSent = 0;
form.addEventListener("submit", async e => {
  e.preventDefault();
  const name = form.name.value.trim(), phone = form.phone.value.trim();
  const show = (t, ok) => { msg.textContent = t; msg.className = "msg " + (ok ? "ok" : "err"); };
  if(form.website.value) return;
  if(name.length < 2) return show(T[lang].e_name);
  if(!/^\+?[\d\s()\-]{7,20}$/.test(phone)) return show(T[lang].e_phone);
  if(Date.now() - lastSent < 30000) return;
  show(T[lang].sending, true);
  const text = `📩 Новая заявка на консультацию\n👤 Имя: ${name}\n📞 Телефон: ${phone}\n🌐 Язык сайта: ${lang.toUpperCase()}`;
  try{
    const res = await fetch("https://api.web3forms.com/submit",{
      method:"POST", headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:CONFIG.ACCESS_KEY, subject:"Новая заявка на консультацию", name, phone, message:text})});
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.message);
    lastSent = Date.now(); form.reset(); show(T[lang].ok, true);
  }catch(err){ show(T[lang].err); }
});
</script>
</body>
</html>
